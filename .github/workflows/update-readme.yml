name: Update README

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  schedule:
    # 매시간 solved.ac 티어·푼 문제 수·스트릭 확인 (바뀐 게 있을 때만 커밋)
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate problem list
        run: python .github/scripts/update_readme.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: solved.ac 현황 및 풀이 통계 자동 업데이트"
          git pull --rebase origin main
          git push
